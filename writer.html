<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writer Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
        }

        .dashboard {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
        }

        button {
            padding: 10px;
            margin-right: 10px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background-color: #45a049;
        }

        #editor {
            margin-top: 30px;
        }

        #textEditor {
            width: 100%;
            height: 300px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .controls {
            margin-top: 10px;
        }

        select, input[type="color"] {
            margin-right: 10px;
        }

        #saveBtn {
            margin-top: 10px;
            padding: 10px 20px;
            background-color: #ff5722;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #saveBtn:hover {
            background-color: #e64a19;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Writer Dashboard</h1>

        <!-- Dashboard Section -->
        <div class="dashboard">
            <button id="addBookBtn">Add Book</button>
            <button id="addChapterBtn">Add Chapter</button>
            <button id="addPageBtn">Add Page</button>
        </div>

        <!-- Editor Section -->
        <div id="editor">
            <textarea id="textEditor" placeholder="Start writing here..."></textarea>
            <div class="controls">
                <label for="fontStyle">Font Style:</label>
                <select id="fontStyle">
                    <option value="Arial">Arial</option>
                    <option value="Times New Roman">Times New Roman</option>
                    <option value="Courier New">Courier New</option>
                </select>

                <label for="fontColor">Font Color:</label>
                <input type="color" id="fontColor">

                <button id="saveBtn">Save</button>
            </div>
        </div>

        <!-- Book, Chapter, and Page Info -->
        <div id="info" style="margin-top: 20px;"></div>
    </div>

    <script>
        // Variables to hold data
        let books = [];
        let currentBook = null;
        let currentChapter = null;

        // Add Book
        document.getElementById('addBookBtn').addEventListener('click', function() {
            const bookTitle = prompt('Enter book title:');
            if (bookTitle) {
                const newBook = { title: bookTitle, chapters: [] };
                books.push(newBook);
                displayInfo();
                alert('Book added successfully!');
            }
        });

        // Add Chapter
        document.getElementById('addChapterBtn').addEventListener('click', function() {
            if (books.length === 0) {
                alert('No books available. Please add a book first.');
                return;
            }
            const chapterTitle = prompt('Enter chapter title:');
            if (chapterTitle) {
                const newChapter = { title: chapterTitle, pages: [] };
                books[books.length - 1].chapters.push(newChapter);
                displayInfo();
                alert('Chapter added successfully!');
            }
        });

        // Add Page
        document.getElementById('addPageBtn').addEventListener('click', function() {
            if (books.length === 0 || books[books.length - 1].chapters.length === 0) {
                alert('No chapters available. Please add a chapter first.');
                return;
            }
            const pageText = document.getElementById('textEditor').value;
            if (pageText) {
                books[books.length - 1].chapters[books[books.length - 1].chapters.length - 1].pages.push(pageText);
                alert('Page added successfully!');
                document.getElementById('textEditor').value = '';  // Clear the editor
                displayInfo();
            } else {
                alert('Please write something before saving.');
            }
        });

        // Font Style Change
        document.getElementById('fontStyle').addEventListener('change', function() {
            document.getElementById('textEditor').style.fontFamily = this.value;
        });

        // Font Color Change
        document.getElementById('fontColor').addEventListener('input', function() {
            document.getElementById('textEditor').style.color = this.value;
        });

        // Save Page (Just to show an alert for now)
        document.getElementById('saveBtn').addEventListener('click', function() {
            alert('Save functionality coming soon!');
        });

        // Display Books, Chapters, and Pages
        function displayInfo() {
            let infoHtml = '<h3>Books:</h3><ul>';
            books.forEach((book, bookIndex) => {
                infoHtml += `<li><strong>${book.title}</strong><ul>`;
                book.chapters.forEach((chapter, chapterIndex) => {
                    infoHtml += `<li><strong>Chapter ${chapterIndex + 1}: ${chapter.title}</strong><ul>`;
                    chapter.pages.forEach((page, pageIndex) => {
                        infoHtml += `<li>Page ${pageIndex + 1}: ${page.slice(0, 30)}...</li>`;
                    });
                    infoHtml += '</ul></li>';
                });
                infoHtml += '</ul></li>';
            });
            infoHtml += '</ul>';
            document.getElementById('info').innerHTML = infoHtml;
        }
    </script>
</body>
</html>
