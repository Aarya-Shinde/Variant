<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reader's Diary</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #E3DAC9, #D2B48C);
            text-align: center;
            padding: 40px;
        }
        .container {
            max-width: 900px;
            margin: auto;
            background: #FAF3E0;
            padding: 30px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeIn 0.8s ease-in-out forwards;
        }
        .entries {
            margin-top: 20px;
            text-align: left;
        }
        .entry {
            background: #FFF8E7;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 6px solid #C2A477;
            font-size: 16px;
            opacity: 0;
            transform: translateX(-30px);
            animation: slideIn 0.8s ease-in-out forwards;
        }
        .entry:nth-child(even) {
            animation-delay: 0.2s;
        }
        .entry h3 {
            color: #9E8256;
            margin-bottom: 5px;
        }
        .entry p {
            margin: 0;
        }
        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes slideIn {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Reader's Diary</h2>
        <div class="entries" id="entries"></div>
    </div>

    <script>
        function displayEntries() {
            let entries = [
                { date: "March 30, 2025", title: "A Journey Through Fantasy", content: "Explored a magical world with deep storytelling and rich characters." },
                { date: "March 28, 2025", title: "Reflections on a Classic", content: "Re-reading an old favorite revealed new insights and emotions." },
                { date: "March 25, 2025", title: "A Sci-Fi Adventure", content: "Dived into futuristic wonders and thrilling discoveries!" },
                { date: "March 22, 2025", title: "Mystery Unfolds", content: "A thrilling novel that kept me guessing until the end." },
                { date: "March 20, 2025", title: "Historical Insights", content: "Learned about an era through the lens of a beautifully written novel." },
                { date: "March 18, 2025", title: "Heartwarming Romance", content: "A touching story that left me smiling and emotional." },
                { date: "March 15, 2025", title: "Psychological Thriller", content: "A deep dive into the human mind with unexpected twists." },
                { date: "March 12, 2025", title: "Poetry and Reflection", content: "A collection of poetry that resonated deeply with my soul." },
                { date: "March 10, 2025", title: "Exploring Non-Fiction", content: "A fascinating book on human psychology and behavior." },
                { date: "March 8, 2025", title: "A Children's Tale", content: "A beautifully illustrated story that brought back childhood memories." }
            ];
            let entriesDiv = document.getElementById("entries");
            entriesDiv.innerHTML = "";
            entries.forEach((entry, index) => {
                let div = document.createElement("div");
                div.classList.add("entry");
                div.innerHTML = `<h3>${entry.title}</h3><small>${entry.date}</small><p>${entry.content}</p>`;
                div.style.animationDelay = `${index * 0.1}s`;
                entriesDiv.appendChild(div);
            });
        }

        document.addEventListener("DOMContentLoaded", displayEntries);
    </script>
</body>
</html>
