<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Recommendations</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Book Recommendations</h1>
        <form id="recommendation-form">
            <label for="genre">Choose a genre:</label>
            <select id="genre" name="genre">
                <option value="fiction">Fiction</option>
                <option value="non-fiction">Non-Fiction</option>
                <option value="fantasy">Fantasy</option>
                <option value="mystery">Mystery</option>
                <option value="sci-fi">Sci-Fi</option>
            </select>
            <button type="submit">Get Recommendations</button>
        </form>
        <div id="book-list">
            <!-- Book recommendations will be displayed here -->
        </div>
    </div>
    <style>body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        margin: 0;
        padding: 20px;
    }
    
    .container {
        max-width: 600px;
        margin: 0 auto;
        background-color: #fff;
        padding: 20px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    
    h1 {
        text-align: center;
        color: #333;
    }
    
    form {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    
    label {
        font-weight: bold;
        color: #333;
    }
    
    select,
    button {
        padding: 10px;
        font-size: 16px;
    }
    
    button {
        background-color: #007BFF;
        color: #fff;
        border: none;
        cursor: pointer;
    }
    
    button:hover {
        background-color: #0056b3;
    }
    
    #book-list {
        margin-top: 20px;
    }
    
    .book-item {
        background-color: #e9ecef;
        padding: 10px;
        margin-bottom: 10px;
        border-radius: 5px;
    }
    </style>
    <script>
    document.getElementById('recommendation-form').addEventListener('submit', function (e) {
        e.preventDefault();
    
        const genre = document.getElementById('genre').value;
        const bookList = document.getElementById('book-list');
    
        // Clear previous recommendations
        bookList.innerHTML = '';
    
        // Sample book recommendations based on genre
        const recommendations = {
            fiction: ['The Great Gatsby', 'To Kill a Mockingbird', '1984'],
            'non-fiction': ['Sapiens', 'Educated', 'Becoming'],
            fantasy: ['Harry Potter', 'The Hobbit', 'The Name of the Wind'],
            mystery: ['Gone Girl', 'The Girl with the Dragon Tattoo', 'Sherlock Holmes'],
            'sci-fi': ['Dune', 'Neuromancer', 'The Left Hand of Darkness']
        };
    
        // Display recommendations
        const selectedBooks = recommendations[genre];
        selectedBooks.forEach(book => {
            const bookItem = document.createElement('div');
            bookItem.classList.add('book-item');
            bookItem.textContent = book;
            bookList.appendChild(bookItem);
        });
    });
    </script>
</body>
</html>
