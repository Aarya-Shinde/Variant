<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Buttons</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #e6ccb2;
        }
        /****************** Actual working buttons styling ********************** */
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 30px;
            margin: auto;
        }
        .button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 280px;
            height: 50px;
            background-color: #764134; /* Brown color */
            color: #fff;
            font-size: large;
            border: 1px solid #654321;
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease;
            position: relative;
        }
        .button:before, .button:after {
            content: '';
            position: absolute;
            width: 10px;
            height: 100%;
            background-color: #654321;
        }
        .button:before {
            left: -10px;
            border-top-left-radius: 5px;
            border-bottom-left-radius: 5px;
        }
        .button:after {
            right: -10px;
            border-top-right-radius: 5px;
            border-bottom-right-radius: 5px;
        }
        .button:hover {
            background-color: #411d0c;
            transform: translateY(-3px);
        }
        .button:active {
            background-color: #2c1d0e;
            transform: translateY(0);
        }


        /*********** Books container with book decoration *********/
        .book-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 200px;
            height: auto;
            margin-right: 20px;
        }
        .book {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 200px;
            height: 50px;
            background-color: #EDE0D4; /* Brown color */
            color: #fff;
            font-size: large;
            border: 1px solid #654321;
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease;
            position: relative;
      
        }
        .book:before, .book:after {
            content: '';
            position: absolute;
            width: 10px;
            height: 100%;
            background-color: #654321;
        }
        .book:before {
            left: -10px;
            border-top-left-radius: 5px;
            border-bottom-left-radius: 5px;
        }
        .book:after {
            right: -10px;
            border-top-right-radius: 5px;
            border-bottom-right-radius: 5px;
        }
        .book:hover {
            background-color: #411d0c;
            transform: translateY(-3px);
        }
        .book:active {
            background-color: #2c1d0e;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="book-container">
        <button class="book"> </button>
        <button class="book"> </button>
        <button class="book"> </button>
        <button class="book"> </button>
        <button class="book"> </button>
        <button class="book"> </button>
        <button class="book"> </button>
        <button class="book"> </button>
        <button class="book"> </button>
        <button class="book"> </button>
        <button class="book"> </button>
    </div>

    <div class="button-container">
        <button class="button">Diary</button>
        <button class="button">Library</button>
        <button class="button">Explore</button>
        <button class="button">Add Book</button>
    </div>
    <div class="book-container">
        <button class="book"> </button>
        <button class="book"> </button>
        <button class="book"> </button>
        <button class="book"> </button>
        <button class="book"> </button>
        <button class="book"> </button>
        <button class="book"> </button>
        <button class="book"> </button>
        <button class="book"> </button>
        <button class="book"> </button>
        <button class="book"> </button>
    </div>

    <script>
        
        document.querySelectorAll('.book').forEach(book => { 
            const randomOffset = Math.floor(Math.random() * 21) - 10; 
            // Generates a random number between -10 and 10 
            book.style.transform = `translateX(${randomOffset}px)`; }); 

            const randomWidth = Math.floor(Math.random() * 40) + 60; 
            // Generates a random width between 60 and 100 pixels
            book.style.width = `${randomWidth}px`;

            
            document.querySelectorAll('.button').forEach(button => { 
                const randomOffset = Math.floor(Math.random() * 21) - 10; 
                // Generates a random number between -10 and 10 
                button.style.transform = `translateX(${randomOffset}px)`;
            });
        </script>
</body>
</html>
