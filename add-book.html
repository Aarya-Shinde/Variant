<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add a Book</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville&display=swap');

        body {
            background-color: #2c1d16;
            color: #e0c9a6;
            font-family: 'Libre Baskerville', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .form-container {
            background: #3b2a1a;
            padding: 20px;
            border-radius: 12px;
            width: 350px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
            border: 2px solid #a67c52;
            text-align: center;
        }

        h2 {
            font-size: 22px;
            margin-bottom: 15px;
            color: #e5d0b8;
        }

        label {
            display: block;
            margin-top: 10px;
            font-size: 14px;
            color: #f5e3cc;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 6px;
            border: 1px solid #a67c52;
            background-color: #5b4229;
            color: #f5e3cc;
            font-size: 14px;
        }

        button {
            background-color: #a67c52;
            color: #2c1d16;
            border: none;
            padding: 10px;
            margin-top: 15px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        button:hover {
            background-color: #8b6746;
        }

        .hidden {
            display: none;
        }

        .message {
            margin-top: 10px;
            font-size: 14px;
            color: #d9a76e;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Add a Book or Novel</h2>
        <form id="addBookForm">
            <label for="bookLink">Book Link (Fanfic/Original)</label>
            <input type="url" id="bookLink" required placeholder="Paste the link here...">

            <label for="bookTitle">Title</label>
            <input type="text" id="bookTitle" required placeholder="Enter book title...">

            <label for="bookType">Category</label>
            <select id="bookType" required>
                <option value="fanfiction">Fanfiction</option>
                <option value="original">Original Novel</option>
            </select>

            <button type="submit">Add Book</button>
            <p class="message hidden" id="successMessage">Book added successfully!</p>
        </form>
    </div>

    <script>
        document.getElementById("addBookForm").addEventListener("submit", function(event) {
            event.preventDefault();
            let bookLink = document.getElementById("bookLink").value;
            let bookTitle = document.getElementById("bookTitle").value;
            let bookType = document.getElementById("bookType").value;

            if (bookLink.trim() === "" || bookTitle.trim() === "") {
                alert("Please fill in all fields.");
                return;
            }

            document.getElementById("successMessage").classList.remove("hidden");
            setTimeout(() => {
                document.getElementById("successMessage").classList.add("hidden");
            }, 3000);

            console.log({ bookLink, bookTitle, bookType });
        });
    </script>

</body>
</html>
