<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter Details</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f9f9f9;
        }

        .chapter-container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }

        .chapter-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .chapter-content {
            font-size: 16px;
            line-height: 1.6;
        }

        .back-link {
            margin-top: 20px;
            display: block;
            text-decoration: none;
            color: #3498db;
            font-size: 16px;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="chapter-container">
        <h1 class="chapter-title" id="chapterTitle"></h1>
        <div class="chapter-content" id="chapterContent"></div>
        <a href="book.html" class="back-link">&larr; Back to Book Details</a>
    </div>

    <script>
        // Define chapter data
        const chapters = {
            1: {
                title: "Chapter 1: The Beginning",
                content: "The journey began on a distant planet, shrouded in mystery and teeming with life. The protagonist ventures into the unknown, seeking answers to the universe's deepest secrets."
            },
            2: {
                title: "Chapter 2: The Awakening",
                content: "As the protagonist explores the infinite cosmos, they encounter ancient civilizations and learn the truth about their origins and the forces that govern the universe."
            },
            3: {
                title: "Chapter 3: Through the Void",
                content: "A harrowing journey through a perilous void tests the hero's courage and resilience, revealing hidden strengths and newfound allies."
            },
            4: {
                title: "Chapter 4: Cosmic Truth",
                content: "The protagonist uncovers the secrets of the cosmos and begins to understand the delicate balance that sustains existence."
            },
            5: {
                title: "Chapter 5: The Chosen Path",
                content: "Faced with a pivotal choice, the hero must decide between personal desires and the greater good of the universe."
            },
            6: {
                title: "Chapter 6: Infinite Realms",
                content: "The protagonist explores infinite realms, each more wondrous and challenging than the last, expanding their understanding of the multiverse."
            },
            7: {
                title: "Chapter 7: The Inner Journey",
                content: "An introspective journey leads the hero to confront their deepest fears and desires, unlocking the potential within."
            },
            8: {
                title: "Chapter 8: The Great Trial",
                content: "The protagonist faces a monumental trial that will determine the fate of the cosmos, testing everything they've learned."
            },
            9: {
                title: "Chapter 9: Endless Possibilities",
                content: "The hero discovers the limitless possibilities of the cosmos and the power of choice in shaping their destiny."
            },
            10: {
                title: "Chapter 10: The Final Revelation",
                content: "In a climactic conclusion, the protagonist unveils the ultimate truth and fulfills their destiny, altering the course of the universe forever."
            }
        };

        // Get chapter number from URL
        const params = new URLSearchParams(window.location.search);
        const chapterNumber = params.get('chapter');

        // Get DOM elements
        const chapterTitle = document.getElementById('chapterTitle');
        const chapterContent = document.getElementById('chapterContent');

        // Display chapter data
        if (chapters[chapterNumber]) {
            chapterTitle.textContent = chapters[chapterNumber].title;
            chapterContent.textContent = chapters[chapterNumber].content;
        } else {
            chapterTitle.textContent = "Chapter Not Found";
            chapterContent.textContent = "The chapter you're looking for doesn't exist.";
        }
    </script>
</body>
</html>
